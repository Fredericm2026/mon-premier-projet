<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FreddyNova Studio - Création de sites web, développement d'applications et solutions digitales sur-mesure.">
    <title>Accueil | FreddyNova Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        nav {
            background-color: #131b2e;
            border-bottom: 1px solid #2a3654;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 700; font-size: 1.2rem; color: #818cf8; text-decoration: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 1.5rem; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #ffffff; }
        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .card {
            background: linear-gradient(145deg, #131b2e, #1a243b);
            border: 1px solid #2a3654;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .badge {
            display: inline-block;
            background-color: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 24px;
            text-transform: uppercase;
        }
        h1 { font-size: 2rem; color: #fff; margin-bottom: 16px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 32px; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 10px;
            transition: background 0.3s;
        }
        .btn:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); }
        footer { text-align: center; padding: 20px; border-top: 1px solid #2a3654; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">FreddyNova Studio</a>
        <div class="nav-links">
            <a href="index.html" class="active">Accueil</a>
            <a href="a-propos.html">À propos</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main>
        <div class="card">
            <span class="badge">● Connecteur MCP Actif</span>
            <h1>Bienvenue sur notre site</h1>
            <p>Découvrez nos services créatifs, notre expertise en développement web et nos solutions d'automatisation.</p>
            <a href="services.html" class="btn">Explorer les services</a>
        </div>
    </main>

    <footer>
        Propulsé par FreddyNova Studio — © 2026
    </footer>
</body>
</html>
