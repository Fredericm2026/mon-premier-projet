<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreddyNova Studio | Mon Premier Projet GitHub</title>
    <style>
        /* Reset et styles de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container principal */
        .card {
            background: linear-gradient(145deg, #131b2e, #1a243b);
            border: 1px solid #2a3654;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(79, 70, 229, 0.15);
        }

        /* Badge d'état */
        .badge {
            display: inline-block;
            background-color: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Titres et textes */
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Bouton d'action */
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
        }

        /* Pied de carte */
        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #2a3654;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">● Connecteur MCP Actif</span>
        <h1>Mon Premier Dépôt GitHub</h1>
        <p>Ce projet web est connecté directement à Claude. Le code HTML et le CSS sont hébergés sur GitHub et prêts à être analysés ou modifiés.</p>
        <a href="https://github.com/Fredericm2026/mon-premier-projet" target="_blank" class="btn">Voir sur GitHub</a>
        
        <div class="footer">
            Propulsé par FreddyNova Studio
        </div>
    </div>

</body>
</html>
