<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | FreddyNova Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        nav {
            background-color: #131b2e;
            border-bottom: 1px solid #2a3654;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 700; font-size: 1.2rem; color: #818cf8; text-decoration: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 1.5rem; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #ffffff; }
        main {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }
        .card {
            background: linear-gradient(145deg, #131b2e, #1a243b);
            border: 1px solid #2a3654;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h1 { font-size: 2rem; color: #fff; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #94a3b8; margin-bottom: 8px; font-size: 0.9rem; }
        input, textarea {
            width: 100%;
            padding: 12px;
            background-color: #0b0f19;
            border: 1px solid #2a3654;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus { border-color: #6366f1; }
        button {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); }
        footer { text-align: center; padding: 20px; border-top: 1px solid #2a3654; color: #64748b; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">FreddyNova Studio</a>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="a-propos.html">À propos</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main>
        <div class="card">
            <h1>Contactez-nous</h1>
            <form onsubmit="event.preventDefault(); alert('Message envoyé avec succès !');">
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" placeholder="Votre nom" required>
                </div>
                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" placeholder="nom@exemple.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Décrivez votre projet..." required></textarea>
                </div>
                <button type="submit">Envoyer le message</button>
            </form>
        </div>
    </main>

    <footer>
        Propulsé par FreddyNova Studio — © 2026
    </footer>
</body>
</html>
