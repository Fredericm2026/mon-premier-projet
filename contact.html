<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez FreddyNova Studio.">
    <title>Contact | FreddyNova Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        nav {
            background-color: #131b2e;
            border-bottom: 1px solid #2a3654;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-weight: 700; font-size: 1.2rem; color: #818cf8; text-decoration: none; }
        .nav-links a { color: #94a3b8; text-decoration: none; margin-left: 1.5rem; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #ffffff; }
        main { max-width: 600px; margin: 40px auto; padding: 0 20px; width: 100%; }
        h1 { font-size: 2.2rem; color: #fff; margin-bottom: 10px; text-align: center; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        form { background: #131b2e; border: 1px solid #2a3654; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; gap: 15px; }
        label { color: #cbd5e1; font-size: 0.9rem; }
        input, textarea { background-color: #0b0f19; border: 1px solid #2a3654; color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; width: 100%; }
        input:focus, textarea:focus { border-color: #6366f1; outline: none; }
        button { background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        button:hover { background: linear-gradient(135deg, #4f46e5, #4338ca); }
        footer { text-align: center; padding: 20px; border-top: 1px solid #2a3654; color: #64748b; font-size: 0.9rem; margin-top: 40px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">FreddyNova Studio</a>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="a-propos.html">À propos</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <main>
        <h1>Contactez-nous</h1>
        <p class="subtitle">Une idée ou un projet ? Discutons-en ensemble.</p>

        <form>
            <div>
                <label for="name">Nom / Entreprise</label>
                <input type="text" id="name" placeholder="Votre nom" required>
            </div>
            <div>
                <label for="email">Adresse Email</label>
                <input type="email" id="email" placeholder="votre@email.com" required>
            </div>
            <div>
                <label for="message">Message ou projet concerné</label>
                <textarea id="message" rows="5" placeholder="Décrivez votre projet ou votre demande de démo..." required></textarea>
            </div>
            <button type="submit">Envoyer le message</button>
        </form>
    </main>

    <footer>
        Propulsé par FreddyNova Studio — © 2026
    </footer>
</body>
</html>
